<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-CRM D4M</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a1f36;
      --muted: #62708a;
      --brand: #2663eb;
      --ok: #0f9d58;
      --warn: #d97706;
      --danger: #dc2626;
      --border: #dbe3f3;
      --shadow: 0 6px 18px rgba(18, 34, 74, 0.08);
      --radius: 12px;
      --gap: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, select, input, textarea {
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      color: var(--text);
    }
    button { cursor: pointer; }
    button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    button.ghost { background: #fff; }
    button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 12px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .panel h2 { margin-top: 0; font-size: 1rem; }
    .kanban-wrap {
      overflow-x: auto;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(250px, 1fr);
      gap: 10px;
      padding-bottom: 6px;
    }
    .column {
      background: #eef3ff;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }
    .column h3 {
      margin: 0;
      padding: 10px;
      font-size: .9rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .dropzone {
      padding: 8px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(11, 26, 64, 0.05);
    }
    .card small { color: var(--muted); }
    .card.dragging { opacity: .5; }
    .row { display: grid; gap: 8px; }
    .row.two { grid-template-columns: 1fr 1fr; }
    .pill {
      display: inline-flex;
      border-radius: 999px;
      font-size: .72rem;
      padding: 2px 8px;
      border: 1px solid var(--border);
      background: #fff;
      margin-left: 4px;
    }
    .muted { color: var(--muted); }
    .grid-2 {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 6px; text-align: left; }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 18, 42, .55);
      z-index: 30;
      padding: 12px;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 14px;
      width: min(680px, 100%);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .wizard-step { display: none; }
    .wizard-step.active { display: block; }
    .sidepanel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(430px, 92vw);
      background: #fff;
      border-left: 1px solid var(--border);
      transform: translateX(101%);
      transition: transform .2s;
      z-index: 25;
      overflow: auto;
      padding: 12px;
    }
    .sidepanel.active { transform: translateX(0); }
    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      background: #111827;
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      z-index: 40;
      display: none;
    }
    .toast.active { display: block; }
    @media (min-width: 980px) {
      .container { grid-template-columns: 2fr 1fr; }
      .grid-2 { grid-template-columns: 1fr 1fr; }
      header { grid-template-columns: 1fr auto; }
    }
  </style>
</head>
<body>
  <!--
  HOW TO USE (Mini-CRM D4M)
  1) Importar prospectos:
     - Usa “Importar Prospectos CSV” con columnas mínimas:
       prospect_code,commercial_name,address,city,province,executive_owner
     - O usa “Importar JSON Backup” para restaurar prospects + event_log.
  2) Registrar evento comercial:
     - Clic en “Nuevo evento”, completa el wizard condicional.
     - El sistema guarda un evento append-only con created_at y event_date.
  3) Conciliación semanal:
     - En “Conciliación semanal”, actualiza customer_id, customer_legal_name y first_sale_id.
     - Al completar IDs se sugieren movimientos (no automáticos) a Cuenta activa/Comprador.
  4) Exportar:
     - Exporta CSV de snapshot de prospectos y event log.
     - Exporta JSON backup completo para respaldo/portabilidad.
  -->

  <header>
    <div>
      <strong>Mini-CRM D4M</strong>
      <div class="muted">Standalone + localStorage + trazabilidad completa</div>
    </div>
    <div class="toolbar">
      <button class="primary" id="btnNewEvent">Nuevo evento</button>
      <button id="btnReconcile">Conciliación semanal</button>
      <button id="btnExportProspects">Export prospects CSV</button>
      <button id="btnExportEvents">Export event log CSV</button>
      <button id="btnExportJSON">Export JSON backup</button>
      <label class="ghost" for="importProspects" style="padding:8px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;">Importar Prospectos CSV</label>
      <input id="importProspects" type="file" accept=".csv" hidden />
      <label class="ghost" for="importJSON" style="padding:8px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer;">Importar JSON Backup</label>
      <input id="importJSON" type="file" accept=".json" hidden />
    </div>
  </header>

  <main class="container">
    <section class="panel" style="grid-column:1/-1;">
      <div class="toolbar">
        <input id="searchInput" placeholder="Buscar prospecto por código/nombre/ciudad" />
        <select id="filterExecutive"><option value="">Todos ejecutivos</option></select>
        <input id="filterMonth" type="month" />
      </div>
    </section>

    <section class="panel" style="grid-column:1/-1;">
      <h2>Tablero Kanban</h2>
      <div class="kanban-wrap" id="kanban"></div>
    </section>

    <section class="panel">
      <h2>Embudo por Ejecutivo</h2>
      <div class="toolbar">
        <label>Desde <input type="date" id="reportFrom"></label>
        <label>Hasta <input type="date" id="reportTo"></label>
        <select id="reportExecutive"><option value="">Todos ejecutivos</option></select>
      </div>
      <div id="reportSummary" class="grid-2" style="margin-top:10px;"></div>
      <h3>Actividad por mes (event_date)</h3>
      <div id="monthlyActivity"></div>
    </section>

    <section class="panel">
      <h2>Últimos eventos</h2>
      <div id="recentEvents"></div>
    </section>
  </main>

  <aside id="prospectPanel" class="sidepanel"></aside>

  <div class="modal" id="wizardModal">
    <div class="modal-box">
      <div class="toolbar" style="justify-content:space-between;">
        <strong>Nuevo evento comercial (wizard)</strong>
        <button id="closeWizard">Cerrar</button>
      </div>
      <div id="wizardSteps"></div>
      <div class="toolbar" style="justify-content:space-between;margin-top:10px;">
        <button id="wizardBack">Atrás</button>
        <button id="wizardNext" class="primary">Siguiente</button>
      </div>
    </div>
  </div>

  <div class="modal" id="reconcileModal">
    <div class="modal-box" style="width:min(1100px,100%);">
      <div class="toolbar" style="justify-content:space-between;">
        <strong>Conciliación semanal</strong>
        <button id="closeReconcile">Cerrar</button>
      </div>
      <div class="toolbar">
        <select id="recExec"><option value="">Todos ejecutivos</option></select>
        <select id="recStatus"><option value="">Todos status</option></select>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Prospect</th><th>Status</th><th>Ejecutivo</th>
              <th>Customer ID</th><th>Razón social</th><th>First Sale ID</th><th>Sugerencia</th>
            </tr>
          </thead>
          <tbody id="reconcileBody"></tbody>
        </table>
      </div>
      <div class="toolbar" style="justify-content:flex-end;">
        <button class="primary" id="saveReconcile">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const LS_KEY = 'd4m_crm_v1';
    const EXECUTIVES = ['Blas Frigerio', 'Román Sanz', 'Juan Luna'];
    const KANBAN_COLUMNS = [
      'Prospectos', 'Intento', 'Contacto efectivo', 'Interesado',
      'En gestión de alta', 'Cuenta activa', 'Comprador', 'Desestimado'
    ];

    let state = loadState();
    let wizard = { step: 0, data: {}, modeCreateProspect: false, selectedProspectId: null };
    let dragInfo = null;

    function loadState() {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
      return { prospects: [], events: [], sequence: 1 };
    }

    function saveState() {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }

    function uid() { return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
    function nowISO() { return new Date().toISOString(); }
    function today() { return new Date().toISOString().slice(0,10); }
    function monthStart() { const d = new Date(); d.setDate(1); return d.toISOString().slice(0,10); }
    function monthEnd() { const d = new Date(); d.setMonth(d.getMonth()+1,0); return d.toISOString().slice(0,10); }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2400);
    }

    function generateProspectCode() {
      const code = `P-${String(state.sequence).padStart(6,'0')}`;
      state.sequence += 1;
      return code;
    }

    function findProspectByCode(code) {
      return state.prospects.find(p => p.prospect_code.trim().toLowerCase() === code.trim().toLowerCase());
    }

    function createEvent(base) {
      const evt = {
        event_id: uid(),
        created_at: nowISO(),
        ...base,
      };
      state.events.push(evt);
      return evt;
    }

    function defaultProspect(input) {
      const ts = nowISO();
      return {
        prospect_id: uid(),
        prospect_code: input.prospect_code || generateProspectCode(),
        commercial_name: input.commercial_name || '',
        address: input.address || '',
        city: input.city || '',
        province: input.province || '',
        zone: input.zone || '',
        executive_owner: input.executive_owner || EXECUTIVES[0],
        status_current: input.status_current || 'Prospectos',
        created_at: ts,
        updated_at: ts,
        customer_id: input.customer_id || null,
        customer_legal_name: input.customer_legal_name || null,
        first_sale_id: input.first_sale_id || null,
        tags: Array.isArray(input.tags) ? input.tags : [],
        phone: input.phone || ''
      };
    }

    function normalizeImportedProspect(row) {
      if (!row.prospect_code || !row.commercial_name) return null;
      const existing = findProspectByCode(row.prospect_code);
      if (existing) {
        Object.assign(existing, {
          commercial_name: row.commercial_name || existing.commercial_name,
          address: row.address || existing.address,
          city: row.city || existing.city,
          province: row.province || existing.province,
          zone: row.zone || existing.zone,
          executive_owner: row.executive_owner || existing.executive_owner,
          updated_at: nowISO()
        });
        return existing;
      }
      const p = defaultProspect(row);
      p.prospect_code = row.prospect_code;
      return p;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (!lines.length) return [];
      const headers = lines[0].split(',').map(h => h.trim());
      return lines.slice(1).map(line => {
        const cols = line.split(',');
        const obj = {};
        headers.forEach((h,i) => obj[h] = (cols[i] || '').trim());
        return obj;
      });
    }

    function toCSV(rows) {
      if (!rows.length) return '';
      const keys = Object.keys(rows[0]);
      const esc = v => `"${String(v ?? '').replaceAll('"','""')}"`;
      const head = keys.join(',');
      const body = rows.map(r => keys.map(k => esc(Array.isArray(r[k]) ? r[k].join('|') : r[k])).join(',')).join('\n');
      return `${head}\n${body}`;
    }

    function download(name, text, mime='text/plain') {
      const b = new Blob([text], {type: mime});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function initFilters() {
      const exSelIds = ['filterExecutive','reportExecutive','recExec'];
      exSelIds.forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = '<option value="">Todos ejecutivos</option>' + EXECUTIVES.map(e=>`<option>${e}</option>`).join('');
      });
      document.getElementById('filterMonth').value = new Date().toISOString().slice(0,7);
      document.getElementById('reportFrom').value = monthStart();
      document.getElementById('reportTo').value = monthEnd();
      const recStatus = document.getElementById('recStatus');
      recStatus.innerHTML = '<option value="">Todos status</option>' + KANBAN_COLUMNS.map(s=>`<option>${s}</option>`).join('');
    }

    function filteredProspects() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const exec = document.getElementById('filterExecutive').value;
      const month = document.getElementById('filterMonth').value;
      return state.prospects.filter(p => {
        const passQ = !q || [p.prospect_code,p.commercial_name,p.city,p.province].join(' ').toLowerCase().includes(q);
        const passExec = !exec || p.executive_owner === exec;
        const passMonth = !month || (p.updated_at || '').slice(0,7) === month || (p.created_at || '').slice(0,7) <= month;
        return passQ && passExec && passMonth;
      });
    }

    function renderKanban() {
      const box = document.getElementById('kanban');
      const list = filteredProspects();
      box.innerHTML = '';
      KANBAN_COLUMNS.forEach(col => {
        const items = list.filter(p => p.status_current === col);
        const c = document.createElement('div');
        c.className = 'column';
        c.innerHTML = `<h3>${col}<span class="pill">${items.length}</span></h3><div class="dropzone" data-col="${col}"></div>`;
        const dz = c.querySelector('.dropzone');
        dz.addEventListener('dragover', e => e.preventDefault());
        dz.addEventListener('drop', e => {
          e.preventDefault();
          if (!dragInfo) return;
          moveStatus(dragInfo.prospectId, dragInfo.from, col, 'kanban_drag');
          dragInfo = null;
        });
        items.forEach(p => dz.appendChild(cardProspect(p)));
        box.appendChild(c);
      });
    }

    function cardProspect(p) {
      const d = document.createElement('div');
      d.className = 'card';
      d.draggable = true;
      d.innerHTML = `<strong>${p.commercial_name || '(sin nombre)'}</strong><br><small>${p.prospect_code} · ${p.city || '-'} · ${p.executive_owner}</small><br>
      <small>CustID: ${p.customer_id || '-'} | SaleID: ${p.first_sale_id || '-'}</small>`;
      d.addEventListener('click', () => openProspectPanel(p.prospect_id));
      d.addEventListener('dragstart', () => { d.classList.add('dragging'); dragInfo = { prospectId: p.prospect_id, from: p.status_current }; });
      d.addEventListener('dragend', () => d.classList.remove('dragging'));
      return d;
    }

    function moveStatus(prospectId, prev, next, reason='manual', eventDate=today(), executive='SYSTEM') {
      if (prev === next) return;
      const p = state.prospects.find(x => x.prospect_id === prospectId);
      if (!p) return;
      let blocked = null;
      if (next === 'Cuenta activa' && !p.customer_id) blocked = 'Bloqueado: falta Customer ID (alta real)';
      if (next === 'Comprador' && !p.first_sale_id) blocked = 'Bloqueado: falta ID de Venta';
      if (blocked) {
        createEvent({
          event_date: eventDate,
          executive,
          prospect_code: p.prospect_code,
          action_type: 'status_change',
          contact_achieved: null,
          comments: blocked,
          subtype: 'status_change',
          prev_status: prev,
          new_status: next,
          reason,
          blocked_reason: blocked
        });
        saveState();
        toast(blocked);
        renderAll();
        return;
      }
      p.status_current = next;
      p.updated_at = nowISO();
      createEvent({
        event_date: eventDate,
        executive,
        prospect_code: p.prospect_code,
        action_type: 'status_change',
        contact_achieved: null,
        comments: `Cambio ${prev} -> ${next}`,
        subtype: 'status_change',
        prev_status: prev,
        new_status: next,
        reason,
        blocked_reason: null
      });
      saveState();
      renderAll();
    }

    function renderRecentEvents() {
      const target = document.getElementById('recentEvents');
      const rows = [...state.events].slice(-12).reverse();
      target.innerHTML = rows.map(e => `<div class="card"><strong>${e.prospect_code}</strong> · ${e.subtype || 'event'}<br><small>${e.event_date} | ${e.executive} | ${e.created_at}</small><br><small>${e.comments || ''}</small></div>`).join('');
    }

    function openProspectPanel(prospectId) {
      const p = state.prospects.find(x => x.prospect_id === prospectId);
      if (!p) return;
      const events = state.events.filter(e => e.prospect_code === p.prospect_code).sort((a,b)=>a.created_at.localeCompare(b.created_at));
      const panel = document.getElementById('prospectPanel');
      panel.innerHTML = `<div class="toolbar" style="justify-content:space-between"><h3>${p.commercial_name}</h3><button id="closePanel">Cerrar</button></div>
      <div><small>${p.prospect_code} · ${p.status_current}</small></div>
      <div class="row two" style="margin-top:8px;"><div><b>Dirección:</b> ${p.address}</div><div><b>Ciudad:</b> ${p.city}, ${p.province}</div></div>
      <div><b>Ejecutivo:</b> ${p.executive_owner}</div>
      <div><b>Customer ID:</b> ${p.customer_id || '-'}</div>
      <div><b>First Sale ID:</b> ${p.first_sale_id || '-'}</div>
      <h4>Historial de eventos</h4>
      ${events.map(e => `<div class="card"><small>${e.event_date} (${e.created_at})</small><br><b>${e.subtype || 'event'}</b> - ${e.action_type}<br>${e.comments || ''}</div>`).join('')}`;
      panel.classList.add('active');
      document.getElementById('closePanel').onclick = () => panel.classList.remove('active');
    }

    function eventInRange(e, from, to) {
      return e.event_date >= from && e.event_date <= to;
    }

    function renderReport() {
      const from = document.getElementById('reportFrom').value;
      const to = document.getElementById('reportTo').value;
      const ex = document.getElementById('reportExecutive').value;
      const subset = state.events.filter(e => eventInRange(e, from, to) && (!ex || e.executive === ex));
      const interestedCodes = new Set(subset.filter(e => e.willing_to_open === 'yes' || e.willing_to_open === 'not_yet').map(e => e.prospect_code));
      const attempts = subset.filter(e => e.contact_achieved === false).length;
      const achieved = subset.filter(e => e.contact_achieved === true).length;
      const altas = state.prospects.filter(p => (!ex || p.executive_owner === ex) && p.customer_id).length;
      const buyers = state.prospects.filter(p => (!ex || p.executive_owner === ex) && p.first_sale_id).length;
      const gap = interestedCodes.size - altas;
      const cards = [
        ['Intentos', attempts], ['Contactos efectivos', achieved],
        ['Interesados', interestedCodes.size], ['Altas reales', altas], ['Compradores', buyers], ['GAP (interesados-altas)', gap]
      ];
      document.getElementById('reportSummary').innerHTML = cards.map(c => `<div class="card"><strong>${c[0]}</strong><div style="font-size:1.35rem;">${c[1]}</div></div>`).join('');
      const byMonth = {};
      subset.forEach(e => {
        const m = (e.event_date || '').slice(0,7);
        byMonth[m] = (byMonth[m] || 0) + 1;
      });
      const months = Object.keys(byMonth).sort();
      document.getElementById('monthlyActivity').innerHTML = months.length ? `<table><thead><tr><th>Mes</th><th>Eventos</th></tr></thead><tbody>${months.map(m=>`<tr><td>${m}</td><td>${byMonth[m]}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">Sin eventos en rango.</div>';
    }

    function openWizard() {
      wizard = { step: 0, data: { event_date: today(), executive: EXECUTIVES[0] }, modeCreateProspect: false, selectedProspectId: null };
      renderWizard();
      document.getElementById('wizardModal').classList.add('active');
    }

    function closeWizard() { document.getElementById('wizardModal').classList.remove('active'); }

    function renderWizard() {
      const steps = [];
      steps.push(`
        <section class="wizard-step ${wizard.step===0?'active':''}">
          <h3>Paso 1: ¿Prospecto existe?</h3>
          <label><input type="radio" name="exists" value="yes" ${!wizard.modeCreateProspect?'checked':''}> Sí</label>
          <label><input type="radio" name="exists" value="no" ${wizard.modeCreateProspect?'checked':''}> No (alta rápida)</label>
          <div id="existingBlock" style="margin-top:8px;${wizard.modeCreateProspect?'display:none':''}">
            <input id="wProspectSearch" placeholder="Buscar por código o nombre" value="${wizard.data.find || ''}">
            <select id="wProspectSelect"><option value="">Seleccionar prospecto (obligatorio)</option>
              ${state.prospects.map(p=>`<option value="${p.prospect_id}" ${wizard.selectedProspectId===p.prospect_id?'selected':''}>${p.prospect_code} - ${p.commercial_name}</option>`).join('')}
            </select>
          </div>
          <div id="newBlock" style="margin-top:8px;${wizard.modeCreateProspect?'':'display:none'}">
            <div class="row two"><input id="nName" placeholder="commercial_name *" value="${wizard.data.commercial_name||''}"><input id="nPhone" placeholder="phone *" value="${wizard.data.phone||''}"></div>
            <input id="nAddress" placeholder="address *" value="${wizard.data.address||''}">
            <div class="row two"><input id="nCity" placeholder="city *" value="${wizard.data.city||''}"><input id="nProvince" placeholder="province *" value="${wizard.data.province||''}"></div>
            <label><input type="checkbox" id="nConfirm" ${wizard.data.confirm_not_found?'checked':''}> Confirmo que busqué y no existía *</label>
          </div>
        </section>`);
      steps.push(`<section class="wizard-step ${wizard.step===1?'active':''}"><h3>Paso 2: Ejecutivo *</h3><select id="wExec">${EXECUTIVES.map(e=>`<option ${wizard.data.executive===e?'selected':''}>${e}</option>`).join('')}</select></section>`);
      steps.push(`<section class="wizard-step ${wizard.step===2?'active':''}"><h3>Paso 3: Fecha del evento *</h3><input type="date" id="wDate" value="${wizard.data.event_date || today()}"></section>`);
      steps.push(`<section class="wizard-step ${wizard.step===3?'active':''}"><h3>Paso 4: Canal *</h3><select id="wAction"><option value="">Elegir</option>${['in-person','phone','whatsapp','video','email'].map(a=>`<option value="${a}" ${wizard.data.action_type===a?'selected':''}>${a}</option>`).join('')}</select></section>`);
      steps.push(`<section class="wizard-step ${wizard.step===4?'active':''}"><h3>Paso 5: ¿Contacto logrado? *</h3><label><input type="radio" name="wContact" value="yes" ${wizard.data.contact_achieved===true?'checked':''}> Sí</label> <label><input type="radio" name="wContact" value="no" ${wizard.data.contact_achieved===false?'checked':''}> No</label>
      <div id="branchNo" style="margin-top:8px;${wizard.data.contact_achieved===false?'':'display:none'}"><select id="wAttempt"><option value="">attempt_reason *</option>${['no_answer','closed_store','wrong_contact','other'].map(r=>`<option value="${r}" ${wizard.data.attempt_reason===r?'selected':''}>${r}</option>`).join('')}</select><textarea id="wCommentsNo" placeholder="comments">${wizard.data.comments||''}</textarea></div>
      <div id="branchYes" style="margin-top:8px;${wizard.data.contact_achieved===true?'':'display:none'}">
        <select id="wInterest"><option value="">interest_level *</option>${['high','medium','low','not_interested'].map(i=>`<option value="${i}" ${wizard.data.interest_level===i?'selected':''}>${i}</option>`).join('')}</select>
        <div id="notInterestedBlock" style="${wizard.data.interest_level==='not_interested'?'':'display:none'}"><select id="wNotReason"><option value="">not_interested_reason *</option>${['price','timing','competition','no_need','other'].map(r=>`<option value="${r}" ${wizard.data.not_interested_reason===r?'selected':''}>${r}</option>`).join('')}</select><button id="btnMarkDisqualified" type="button">Marcar como Desestimado</button></div>
        <div id="interestedBlock" style="${wizard.data.interest_level && wizard.data.interest_level!=='not_interested'?'':'display:none'}">
          <select id="wWilling"><option value="">willing_to_open *</option>${['yes','not_yet','no'].map(w=>`<option value="${w}" ${wizard.data.willing_to_open===w?'selected':''}>${w}</option>`).join('')}</select>
          <select id="wPotential"><option value="">estimated_potential *</option>${['high','medium','low'].map(p=>`<option value="${p}" ${wizard.data.estimated_potential===p?'selected':''}>${p}</option>`).join('')}</select>
          <div id="nextActionBlock" style="${wizard.data.willing_to_open==='yes'||wizard.data.willing_to_open==='not_yet'?'':'display:none'}">
            <select id="wNextAction"><option value="">next_action_type *</option>${['call','second_visit','send_conditions','send_samples','request_docs','other'].map(n=>`<option value="${n}" ${wizard.data.next_action_type===n?'selected':''}>${n}</option>`).join('')}</select>
            <input id="wNextDate" type="date" value="${wizard.data.next_action_date||''}">
          </div>
          <textarea id="wCommentsYes" placeholder="comments">${wizard.data.comments||''}</textarea>
        </div>
      </div>
      </section>`);
      document.getElementById('wizardSteps').innerHTML = steps.join('');
      bindWizardInputs();
      document.getElementById('wizardBack').style.visibility = wizard.step===0?'hidden':'visible';
      document.getElementById('wizardNext').textContent = wizard.step===4 ? 'Guardar evento' : 'Siguiente';
    }

    function bindWizardInputs() {
      document.querySelectorAll('input[name="exists"]').forEach(r => r.onchange = () => { wizard.modeCreateProspect = r.value === 'no'; renderWizard(); });
      const wSelect = document.getElementById('wProspectSelect');
      if (wSelect) wSelect.onchange = () => wizard.selectedProspectId = wSelect.value;
      const wSearch = document.getElementById('wProspectSearch');
      if (wSearch) wSearch.oninput = () => {
        wizard.data.find = wSearch.value;
        const v = wSearch.value.toLowerCase();
        const opts = state.prospects.filter(p => `${p.prospect_code} ${p.commercial_name}`.toLowerCase().includes(v));
        const sel = document.getElementById('wProspectSelect');
        sel.innerHTML = '<option value="">Seleccionar prospecto (obligatorio)</option>' + opts.map(p=>`<option value="${p.prospect_id}">${p.prospect_code} - ${p.commercial_name}</option>`).join('');
      };
      ['nName','nAddress','nCity','nProvince','nPhone'].forEach(id => { const el = document.getElementById(id); if (el) el.oninput = ()=> wizard.data[{nName:'commercial_name',nAddress:'address',nCity:'city',nProvince:'province',nPhone:'phone'}[id]] = el.value; });
      const nConfirm = document.getElementById('nConfirm'); if (nConfirm) nConfirm.onchange = ()=> wizard.data.confirm_not_found = nConfirm.checked;
      const exec = document.getElementById('wExec'); if (exec) exec.onchange = ()=> wizard.data.executive = exec.value;
      const d = document.getElementById('wDate'); if (d) d.onchange = ()=> wizard.data.event_date = d.value;
      const a = document.getElementById('wAction'); if (a) a.onchange = ()=> wizard.data.action_type = a.value;
      document.querySelectorAll('input[name="wContact"]').forEach(r => r.onchange = () => { wizard.data.contact_achieved = r.value === 'yes'; renderWizard(); });
      const attempt = document.getElementById('wAttempt'); if (attempt) attempt.onchange = ()=> wizard.data.attempt_reason = attempt.value;
      const comNo = document.getElementById('wCommentsNo'); if (comNo) comNo.oninput = ()=> wizard.data.comments = comNo.value;
      const interest = document.getElementById('wInterest'); if (interest) interest.onchange = ()=> { wizard.data.interest_level = interest.value; renderWizard(); };
      const noR = document.getElementById('wNotReason'); if (noR) noR.onchange = ()=> wizard.data.not_interested_reason = noR.value;
      const willing = document.getElementById('wWilling'); if (willing) willing.onchange = ()=> { wizard.data.willing_to_open = willing.value; renderWizard(); };
      const pot = document.getElementById('wPotential'); if (pot) pot.onchange = ()=> wizard.data.estimated_potential = pot.value;
      const nAct = document.getElementById('wNextAction'); if (nAct) nAct.onchange = ()=> wizard.data.next_action_type = nAct.value;
      const nDate = document.getElementById('wNextDate'); if (nDate) nDate.onchange = ()=> wizard.data.next_action_date = nDate.value;
      const comYes = document.getElementById('wCommentsYes'); if (comYes) comYes.oninput = ()=> wizard.data.comments = comYes.value;
      const markDisq = document.getElementById('btnMarkDisqualified');
      if (markDisq) markDisq.onclick = () => {
        const p = getOrCreateProspectFromWizard();
        if (!p) return;
        moveStatus(p.prospect_id, p.status_current, 'Desestimado', 'wizard_not_interested', wizard.data.event_date || today(), wizard.data.executive || p.executive_owner);
        toast('Prospecto marcado como Desestimado');
      };
    }

    function validateWizardStep() {
      const d = wizard.data;
      if (wizard.step === 0) {
        if (!wizard.modeCreateProspect && !wizard.selectedProspectId) return 'Debes seleccionar un prospecto existente.';
        if (wizard.modeCreateProspect) {
          if (!d.commercial_name || !d.address || !d.city || !d.province || !d.phone || !d.confirm_not_found) return 'Completa alta rápida y confirma búsqueda.';
        }
      }
      if (wizard.step === 1 && !d.executive) return 'Ejecutivo obligatorio.';
      if (wizard.step === 2 && !d.event_date) return 'event_date obligatorio.';
      if (wizard.step === 3 && !d.action_type) return 'Canal obligatorio.';
      if (wizard.step === 4) {
        if (d.contact_achieved !== true && d.contact_achieved !== false) return 'Debes indicar si hubo contacto.';
        if (d.contact_achieved === false && !d.attempt_reason) return 'attempt_reason obligatorio cuando no hay contacto.';
        if (d.contact_achieved === true) {
          if (!d.interest_level) return 'interest_level obligatorio.';
          if (d.interest_level === 'not_interested' && !d.not_interested_reason) return 'not_interested_reason obligatorio.';
          if (d.interest_level !== 'not_interested') {
            if (!d.estimated_potential) return 'estimated_potential obligatorio.';
            if (!d.willing_to_open) return 'willing_to_open obligatorio.';
            if ((d.willing_to_open === 'yes' || d.willing_to_open === 'not_yet') && (!d.next_action_type || !d.next_action_date)) {
              return 'next_action_type y next_action_date obligatorios para willing_to_open yes/not_yet.';
            }
          }
        }
      }
      return null;
    }

    function getOrCreateProspectFromWizard() {
      if (!wizard.modeCreateProspect) return state.prospects.find(p => p.prospect_id === wizard.selectedProspectId);
      const d = wizard.data;
      const p = defaultProspect({
        commercial_name: d.commercial_name,
        address: d.address,
        city: d.city,
        province: d.province,
        executive_owner: d.executive,
        phone: d.phone,
      });
      while (findProspectByCode(p.prospect_code)) p.prospect_code = generateProspectCode();
      state.prospects.push(p);
      saveState();
      return p;
    }

    function submitWizard() {
      const err = validateWizardStep();
      if (err) return toast(err);
      const p = getOrCreateProspectFromWizard();
      if (!p) return toast('Prospecto no encontrado.');
      const d = wizard.data;
      createEvent({
        event_date: d.event_date,
        executive: d.executive,
        prospect_code: p.prospect_code,
        action_type: d.action_type,
        contact_achieved: d.contact_achieved,
        attempt_reason: d.contact_achieved ? null : d.attempt_reason,
        interest_level: d.contact_achieved ? d.interest_level : null,
        willing_to_open: d.contact_achieved ? (d.willing_to_open || null) : null,
        not_interested_reason: d.interest_level === 'not_interested' ? d.not_interested_reason : null,
        estimated_potential: d.contact_achieved && d.interest_level !== 'not_interested' ? d.estimated_potential : null,
        next_action_type: (d.willing_to_open === 'yes' || d.willing_to_open === 'not_yet') ? d.next_action_type : null,
        next_action_date: (d.willing_to_open === 'yes' || d.willing_to_open === 'not_yet') ? d.next_action_date : null,
        comments: d.comments || '',
        subtype: 'commercial_event'
      });
      p.updated_at = nowISO();
      if (d.contact_achieved === false && p.status_current === 'Prospectos') toast('Sugerencia: mover a Intento');
      if (d.contact_achieved === true) toast('Evento guardado. Sugerencia: revisar movimiento de columna.');
      saveState();
      closeWizard();
      renderAll();
    }

    function renderReconcile() {
      const ex = document.getElementById('recExec').value;
      const st = document.getElementById('recStatus').value;
      const rows = state.prospects.filter(p => (!ex || p.executive_owner===ex) && (!st || p.status_current===st));
      document.getElementById('reconcileBody').innerHTML = rows.map(p => {
        const sug = p.first_sale_id ? 'Sugerir mover a Comprador' : p.customer_id ? 'Sugerir mover a Cuenta activa' : '-';
        return `<tr data-id="${p.prospect_id}"><td>${p.prospect_code}<br><small>${p.commercial_name}</small></td><td>${p.status_current}</td><td>${p.executive_owner}</td>
        <td><input value="${p.customer_id || ''}" data-f="customer_id"></td>
        <td><input value="${p.customer_legal_name || ''}" data-f="customer_legal_name"></td>
        <td><input value="${p.first_sale_id || ''}" data-f="first_sale_id"></td><td>${sug}</td></tr>`;
      }).join('');
    }

    function saveReconcile() {
      document.querySelectorAll('#reconcileBody tr').forEach(tr => {
        const id = tr.dataset.id;
        const p = state.prospects.find(x => x.prospect_id===id);
        if (!p) return;
        const prev = { customer_id: p.customer_id, customer_legal_name: p.customer_legal_name, first_sale_id: p.first_sale_id };
        tr.querySelectorAll('input[data-f]').forEach(inp => { p[inp.dataset.f] = inp.value.trim() || null; });
        p.updated_at = nowISO();
        const changes = {};
        ['customer_id','customer_legal_name','first_sale_id'].forEach(k => { if ((prev[k]||null)!==(p[k]||null)) changes[k] = {from:prev[k],to:p[k]}; });
        if (Object.keys(changes).length) {
          createEvent({
            event_date: today(),
            executive: p.executive_owner,
            prospect_code: p.prospect_code,
            action_type: 'weekly_reconciliation',
            contact_achieved: null,
            comments: JSON.stringify(changes),
            subtype: 'reconciliation_update'
          });
        }
      });
      saveState();
      toast('Conciliación guardada.');
      renderAll();
      renderReconcile();
    }

    function wireActions() {
      document.getElementById('btnNewEvent').onclick = openWizard;
      document.getElementById('closeWizard').onclick = closeWizard;
      document.getElementById('wizardBack').onclick = () => { wizard.step = Math.max(0, wizard.step-1); renderWizard(); };
      document.getElementById('wizardNext').onclick = () => {
        const err = validateWizardStep();
        if (err) return toast(err);
        if (wizard.step < 4) { wizard.step++; renderWizard(); }
        else submitWizard();
      };
      ['searchInput','filterExecutive','filterMonth','reportFrom','reportTo','reportExecutive'].forEach(id => document.getElementById(id).addEventListener('input', renderAll));
      document.getElementById('btnReconcile').onclick = () => { document.getElementById('reconcileModal').classList.add('active'); renderReconcile(); };
      document.getElementById('closeReconcile').onclick = () => document.getElementById('reconcileModal').classList.remove('active');
      document.getElementById('saveReconcile').onclick = saveReconcile;
      document.getElementById('recExec').onchange = renderReconcile;
      document.getElementById('recStatus').onchange = renderReconcile;

      document.getElementById('btnExportProspects').onclick = () => download('prospects_snapshot.csv', toCSV(state.prospects), 'text/csv');
      document.getElementById('btnExportEvents').onclick = () => download('event_log.csv', toCSV(state.events), 'text/csv');
      document.getElementById('btnExportJSON').onclick = () => download('d4m_backup.json', JSON.stringify(state, null, 2), 'application/json');

      document.getElementById('importProspects').onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const rows = parseCSV(String(r.result || ''));
          let inserted = 0;
          rows.forEach(row => {
            const p = normalizeImportedProspect(row);
            if (!p) return;
            if (!state.prospects.find(x => x.prospect_id === p.prospect_id)) {
              if (findProspectByCode(p.prospect_code)) return;
              state.prospects.push(p); inserted++;
            }
          });
          saveState(); renderAll(); toast(`Importación OK: ${inserted} prospectos nuevos.`);
        };
        r.readAsText(f);
      };

      document.getElementById('importJSON').onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const parsed = JSON.parse(String(r.result || '{}'));
            if (!Array.isArray(parsed.prospects) || !Array.isArray(parsed.events)) throw new Error('JSON inválido');
            const seen = new Set();
            parsed.prospects.forEach(p => {
              if (!p.prospect_code || seen.has(p.prospect_code)) return;
              seen.add(p.prospect_code);
            });
            state = { prospects: parsed.prospects, events: parsed.events, sequence: parsed.sequence || 1 };
            saveState(); renderAll(); toast('Backup restaurado.');
          } catch (err) { toast('No se pudo importar JSON.'); }
        };
        r.readAsText(f);
      };
    }

    function renderAll() {
      renderKanban();
      renderRecentEvents();
      renderReport();
    }

    initFilters();
    wireActions();
    renderAll();
  </script>
</body>
</html>
